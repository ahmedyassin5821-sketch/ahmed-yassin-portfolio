<!doctype html>
<html lang="en" dir="ltr" class="no-js">
  <head>
    <meta charset="utf-8" />
    <title>Ahmed Yassin — Front-End &amp; eCommerce Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ahmed Yassin — Front-End Developer at 2B, Angular engineer, freelance Shopify developer, and Magento 2 specialist based in Cairo."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fdfcfb" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Feature flag for progressive enhancement.

      Every scroll-reveal initial state is scoped to `.js` in
      styles/_motion.scss. Swapping the class here — synchronously, in <head>,
      before first paint — means the staged styles only ever apply when
      scripting is actually available. If this script does not run, the selector
      never matches and all content renders visible.

      That inversion is deliberate: content must never depend on JavaScript to
      become readable.
    -->
    <script>
      document.documentElement.classList.remove('no-js');
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
