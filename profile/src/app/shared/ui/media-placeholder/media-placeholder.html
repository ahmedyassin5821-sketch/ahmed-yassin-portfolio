<!--
  Decorative: the project name and description are already rendered as real text
  by the surrounding surface, so this frame adds nothing for a screen reader.
-->
<div class="placeholder" aria-hidden="true">
  @if (caption()) {
    <span class="placeholder__caption">{{ caption() }}</span>
  }

  @if (label()) {
    <span class="placeholder__label">{{ label() }}</span>
  }
</div>
