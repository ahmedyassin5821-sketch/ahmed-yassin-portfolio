@if (content(); as p) {
  <article class="detail" aria-labelledby="detail-title">
    <!-- Back first in the DOM, so it is the first thing reached by keyboard. -->
    <a class="detail__back" routerLink="/work">
      <app-icon name="arrow-left" size="sm" />
      {{ c().actions.backToWork }}
    </a>

    <!--
      The business, then the build, then the imagery.
      A reader should be able to say what this project *is* — what industry, what
      market, what kind of product — before a single technology is named. The
      stack and the screenshots follow that, not the other way round.
    -->
    <header class="detail__head">
      <p class="detail__index" aria-hidden="true">{{ indexLabel() }}</p>

      <h1 id="detail-title" class="detail__title" dir="auto">{{ p.name }}</h1>

      <!-- Field, market, domain: the three facts that place the business. -->
      <app-project-facts class="detail__identity" variant="identity" [facts]="identity()" />

      <p class="detail__stack"><span class="ltr-isolate">{{ p.stack }}</span></p>

      <div class="detail__actions">
        @if (p.url) {
          <!--
            TextLink, not Button: Button renders a real <button> on purpose and
            refuses an href. TextLink already carries rel="noopener noreferrer",
            the external glyph, and the localised new-tab warning.
          -->
          <app-text-link class="detail__visit" [href]="p.url">
            {{ c().actions.visit }}
          </app-text-link>
        } @else {
          <!-- Stated, not boxed. A dashed frame read as a disabled control. -->
          <p class="detail__private">
            <span class="detail__private-label">{{ c().actions.private }}</span>
            <span class="detail__private-note">{{ c().actions.privateNote }}</span>
          </p>
        }
      </div>

      <!--
        What the business actually is. Inside the header so it shares the title's
        column: as a sibling it took `ds.container` and its own 46ch measure,
        which `margin-inline: auto` then centred in the viewport — leaving the
        paragraph floating 180px to the right of the name it describes.
      -->
      <p class="detail__brief">{{ p.brief }}</p>
    </header>

    <!--
      Full-bleed: the cover breaks the measure the type sits in. This is the one
      moment on the page where the work is larger than the words about it.
    -->
    <figure class="detail__cover">
      <picture>
        @if (p.cover.avif) {
          <source type="image/avif" [srcset]="p.cover.avif" [attr.sizes]="sizes" />
        }
        <img
          [src]="p.cover.src"
          [attr.srcset]="p.cover.srcset"
          [attr.sizes]="sizes"
          [alt]="p.cover.alt"
          [width]="p.cover.width"
          [height]="p.cover.height"
          loading="eager"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
    </figure>

    <!-- How it was built. Second, because it answers a later question. -->
    <app-project-facts variant="build" [facts]="facts()" />

    @if (p.screenshots.length) {
      <app-project-gallery
        [shots]="p.screenshots"
        [title]="c().labels.screenshots"
        [regionLabel]="fill(c().a11y.gallery, p.name)"
        [sizes]="sizes"
      />
    }

    @if (neighbours(); as nav) {
      <app-project-nav
        [previous]="nav.previous"
        [next]="nav.next"
        [previousLabel]="c().actions.previous"
        [nextLabel]="c().actions.next"
        [previousA11y]="fill(c().a11y.previousProject, nav.previous.name)"
        [nextA11y]="fill(c().a11y.nextProject, nav.next.name)"
        [regionLabel]="c().index.title"
      />
    }
  </article>
}
