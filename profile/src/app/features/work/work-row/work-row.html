<article
  class="row"
  (pointerenter)="focused.emit(project().slug)"
  (focusin)="focused.emit(project().slug)"
>
  <p class="row__index" aria-hidden="true">{{ indexLabel() }}</p>

  <div class="row__body">
    <h2 class="row__name" dir="auto">
      <!--
        One anchor, stretched over the row by ::after. Wrapping the whole article
        would fold the category, the stack and the link marker into the link's
        accessible name.
      -->
      <a class="row__link" [routerLink]="['/work', project().slug]">
        {{ project().name }}
        <span class="sr-only">— {{ viewLabel() }}</span>
      </a>
    </h2>

    <!-- What it is, then what it was built with. Two scannable lines. -->
    <p class="row__category">{{ project().category }}</p>
    <p class="row__stack"><span class="ltr-isolate">{{ project().stack }}</span></p>
  </div>

  <!--
    Link status as text, not a pill. "Private" is a fact about the work, and a
    dashed badge made it look like a disabled control.
  -->
  <p class="row__status">{{ statusLabel() }}</p>

  <!--
    Below `md` the row carries its own image; above it the sticky pane does.
    Rendered in both cases so nothing depends on the observer.
  -->
  <div class="row__media">
    @if (project().image; as image) {
      <img
        class="row__image"
        [src]="image.src"
        [attr.srcset]="image.srcset"
        [attr.sizes]="sizes"
        [alt]="image.alt"
        [width]="image.width"
        [height]="image.height"
        loading="lazy"
        decoding="async"
      />
    } @else {
      <app-media-placeholder [caption]="project().name" [label]="placeholderLabel()" />
    }
  </div>
</article>
