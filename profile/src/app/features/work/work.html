<section class="work" aria-labelledby="work-title">
  <header class="work__head">
    <p class="work__eyebrow">{{ c().index.eyebrow }}</p>
    <h1 id="work-title" class="work__title">{{ c().index.title }}</h1>
    <p class="work__lede">{{ c().index.lede }}</p>

    <!-- The career total and the size of this selection, both from data. The
         page never states a total derived from the array. -->
    <p class="work__count">{{ countLabel() }}</p>
  </header>

  <div class="work__body">
    <ol class="work__index" role="list">
      @for (project of rows(); track project.slug) {
        <li>
          <app-work-row
            [project]="project"
            [index]="$index"
            [active]="project.slug === activeSlug()"
            (focused)="setActive($event)"
            [statusLabels]="statusLabels()"
            [viewLabel]="c().a11y.viewProject.replace('{name}', project.name)"
            [placeholderLabel]="c().labels.awaitingAssets"
          />
        </li>
      }
    </ol>

    <!-- Decorative: every project's name, category and stack is real text in the
         rows beside it. Holds the first project until the reader moves. -->
    <app-work-preview
      class="work__preview"
      [projects]="previews()"
      [activeSlug]="activeSlug()"
      [placeholderLabel]="c().labels.awaitingAssets"
    />
  </div>
</section>
