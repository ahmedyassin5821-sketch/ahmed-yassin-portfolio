<section class="strata" aria-labelledby="strata-title">
  <header class="strata__head">
    <p class="strata__index">{{ c().index }}</p>
    <h2 id="strata-title" class="strata__title" appReveal>{{ c().title }}</h2>
    <p class="strata__lede" appReveal [revealIndex]="1">{{ c().lede }}</p>
  </header>

  <ol class="strata__list" role="list">
    @for (group of groups(); track group.platform; let i = $index) {
      <!-- data-home-act marks this row for the scroll scrub; the entrance
           itself is handled by appReveal, not by GSAP. -->
      <li class="stratum" data-home-act appReveal [revealIndex]="i">
        <p class="stratum__index" aria-hidden="true">{{ group.index }}</p>

        <div class="stratum__body">
          <h3 class="stratum__name">
            <!-- Platform names are proper nouns: Latin in both languages. -->
            <span class="ltr-isolate">{{ group.label }}</span>
          </h3>
          <p class="stratum__summary">{{ group.summary }}</p>
        </div>

        <ul class="stratum__projects" role="list">
          @for (name of group.names; track name) {
            <li class="stratum__project"><span class="ltr-isolate">{{ name }}</span></li>
          }
        </ul>
      </li>
    }
  </ol>
</section>
