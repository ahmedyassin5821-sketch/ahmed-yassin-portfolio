<section class="hero" aria-labelledby="hero-name">
  <!--
    Visual layer, behind the text.

    The poster is always in the server-rendered HTML, so the composition is
    present at first paint and never pops in. When WebGL is viable the canvas is
    fetched on idle and fades over the top of it; when it is not, the poster IS
    the artwork. Both are built from the same AY_MARK_PATH, so they cannot drift.
  -->
  <div class="hero__visual" aria-hidden="true">
    <!--
      The poster retires only once the scene reports it is genuinely rendering,
      so the two never paint their layers on top of each other — and if the
      scene fails to build, the poster simply stays and the composition holds.
    -->
    <app-strata-poster
      class="hero__poster"
      [class.is-retired]="sceneReady()"
      [layers]="posterLayers()"
    />

    @if (canRunWebGL()) {
      @defer (on idle) {
        <app-strata-canvas class="hero__canvas" (ready)="sceneReady.set(true)" />
      }
    }
  </div>

  <div class="hero__content">
    <p class="hero__eyebrow">{{ c().eyebrow }}</p>

    <!--
      The LCP element. Plain text, no animation, outside every deferred block.
    -->
    <h1 id="hero-name" class="hero__name">{{ c().name }}</h1>

    <p class="hero__role">{{ c().role }}</p>

    <p class="hero__lede">{{ c().lede }}</p>

    <dl class="hero__meta">
      @for (item of c().meta; track item.label) {
        <div class="hero__meta-row">
          <dt class="hero__meta-label">{{ item.label }}</dt>
          <!--
            dir="auto", not .ltr-isolate.

            These values are mixed-script: "مطوّر واجهات أمامية في 2B" is Arabic
            containing a Latin token, while "Angular · Magento · Shopify" is pure
            Latin inside an Arabic page. Forcing LTR on the first breaks it — the
            B detaches from the 2 and jumps to the far edge. dir="auto" resolves
            direction from the first strong character, so each value gets the
            layout its own content calls for.
          -->
          <dd class="hero__meta-value" dir="auto">{{ item.value }}</dd>
        </div>
      }
    </dl>
  </div>

  <p class="hero__scroll" aria-hidden="true">{{ c().scrollHint }}</p>

  <!-- The visual conveys nothing that is not written above; this describes it
       for anyone who asks, without duplicating the page's information. -->
  <p class="sr-only">{{ visual().description }}</p>
</section>
