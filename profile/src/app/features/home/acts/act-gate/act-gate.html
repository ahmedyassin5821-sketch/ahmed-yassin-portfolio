<section class="gate" [attr.aria-labelledby]="'gate-' + platform()">
  <header class="gate__head">
    <p class="gate__eyebrow">{{ c().eyebrow }}</p>

    <!--
      The platform name is a proper noun and stays Latin in both languages;
      .ltr-isolate stops the bidi algorithm reordering it inside Arabic copy.
    -->
    <h2 class="gate__name" [id]="'gate-' + platform()">
      <span class="ltr-isolate">{{ label() }}</span>
    </h2>

    <p class="gate__count" aria-hidden="true">{{ countLabel() }}</p>

    <!--
      What this platform does for a business, not what it is made of. One line,
      from PLATFORM_GROUPS, so the landing page and /about say the same thing.
    -->
    <p class="gate__summary">{{ summary() }}</p>
  </header>

  <!--
    Not a grid. The first project of each platform leads at a larger size and the
    rest support it, with the media side alternating — so a gate reads as one
    art-directed composition rather than as equal tiles.
  -->
  <ul class="gate__plates" role="list">
    @for (project of projects(); track project.slug) {
      <!-- --stagger paces the supporting plates so they cascade in after the
           lead has been read rather than all arriving together. -->
      <li class="gate__plate" [class.is-lead]="$first" [style.--stagger]="$index - 1">
        <app-project-figure
          [project]="project"
          [index]="offset() + $index"
          [variant]="$first ? 'lead' : 'support'"
          [align]="$first ? 'end' : 'start'"
          [viewLabel]="c().viewLabel"
        />
      </li>
    }
  </ul>
</section>
