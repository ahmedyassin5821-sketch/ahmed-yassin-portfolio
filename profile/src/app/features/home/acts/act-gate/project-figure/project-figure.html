<figure class="figure">
  <div class="figure__media">
    <img
      class="figure__image"
      [src]="project().image.src"
      [attr.srcset]="project().image.srcset"
      [attr.sizes]="sizes()"
      [alt]="project().image.alt"
      [width]="project().image.width"
      [height]="project().image.height"
      loading="lazy"
      decoding="async"
    />
  </div>

  <figcaption class="figure__meta">
    <!-- The numeral is editorial furniture: it paces the sequence and gives the
         eye an entry point. The name beside it carries the accessible label. -->
    <p class="figure__index" aria-hidden="true">{{ indexLabel() }}</p>

    <h3 class="figure__name" dir="auto">
      @if (project().url) {
        <a class="figure__link" [href]="project().url!" target="_blank" rel="noopener noreferrer">
          {{ project().name }}
          <span class="sr-only">{{ viewLabel() }}</span>
        </a>
      } @else {
        {{ project().name }}
      }
    </h3>

    <!-- What industry, where it trades, then what it was built with. Three short
         lines, read in one glance, so nobody parses a paragraph to place it. -->
    <p class="figure__field">{{ project().field }}</p>
    <p class="figure__market">{{ project().market }}</p>
    <p class="figure__stack"><span class="ltr-isolate">{{ project().stack }}</span></p>
  </figcaption>
</figure>
