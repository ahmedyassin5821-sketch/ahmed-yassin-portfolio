# Builds the Angular portfolio and publishes it to GitHub Pages.
#
# The application lives in `profile/`, not at the repository root, so every step
# that touches it sets `working-directory`. Nothing here is machine-specific: the
# base href and the site URL are derived inside `scripts/build-pages.mjs` from
# `GITHUB_REPOSITORY`, which Actions provides.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# The minimum Pages needs: read the repo, publish an artifact, mint the deploy token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a half-finished
# Pages deployment can leave the site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the local toolchain. `npm` caching keyed on the lockfile in the
          # subdirectory, or the cache silently never hits.
          node-version: 22
          cache: npm
          cache-dependency-path: profile/package-lock.json

      # `npm ci` and not `npm install`: it installs exactly what the lockfile says
      # and fails if the lockfile and package.json disagree, which is what makes a
      # CI build reproducible.
      - name: Install dependencies
        run: npm ci

      - name: Check styles
        run: npm run lint:styles

      - name: Run tests
        run: npm test

      # BEFORE the build, because the build needs its outputs.
      #
      # `base_path` and `base_url` come from the repository's actual Pages settings,
      # so adding a custom domain later changes them and the build follows. Deriving
      # the prefix from the repository name instead would keep emitting
      # `/ahmed-yassin-portfolio/` after a custom domain moved the site to the root.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Prerenders every route, then writes 404.html, .nojekyll, robots.txt and
      # sitemap.xml. Fails the build if the not-found page did not prerender.
      - name: Build for Pages
        run: >-
          node scripts/build-pages.mjs
          --base-href "${{ steps.pages.outputs.base_path }}"
          --site "${{ steps.pages.outputs.base_url }}"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          # Relative to the repository root, not to `working-directory`.
          path: profile/dist/profile/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
